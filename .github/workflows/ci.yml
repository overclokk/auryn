name: Continuous Integration

on:
  - push
  - pull_request

jobs:
  tests:
    name: PHP ${{ matrix.php-version }}

    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.3', '8.4' ]
        experimental: [ false ]
        include:
          - php-version: '8.5'
            experimental: true

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: apcu
          ini-values: apc.enable_cli=1

      - uses: ramsey/composer-install@v3

      - name: Run tests
        run: vendor/bin/phpunit

  quality:
    name: Static analysis and coding style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run style fixer
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
        run: vendor/bin/php-cs-fixer fix --dry-run --diff -v

      - name: Run composer-require-checker
        run: |
          curl -sSfL -o composer-require-checker.phar https://github.com/maglnet/ComposerRequireChecker/releases/latest/download/composer-require-checker.phar
          php composer-require-checker.phar check composer.json --config-file $PWD/composer-require-check.json
